<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ra1nbow Repo</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.9);
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --accent-tg: #229ED9;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --border-color: rgba(0, 255, 102, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 75%),
                linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85));
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .repo-icon {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 18px rgba(0, 255, 102, 0.4);
            object-fit: cover;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-green);
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .devs-section {
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
        }

        .dev-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 420px) {
            .dev-cards {
                grid-template-columns: 1fr;
            }
        }

        .dev-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .dev-avatar-img {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--accent-green);
            box-shadow: 0 0 6px rgba(0, 255, 102, 0.4);
            object-fit: cover;
        }

        .dev-avatar-img.cyan {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .dev-name {
            font-weight: bold;
            font-size: 0.82rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tg-section {
            margin-bottom: 20px;
        }

        .btn-tg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: rgba(34, 158, 217, 0.1);
            border: 1px solid var(--accent-tg);
            color: #53c7ff;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(34, 158, 217, 0.15);
        }

        .btn-tg:active {
            background: var(--accent-tg);
            color: #fff;
        }

        .managers-section {
            margin-bottom: 15px;
        }

        .pm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-pm {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-sileo { border-color: rgba(0, 122, 255, 0.4); color: #4da6ff; }
        .btn-zebra { border-color: rgba(255, 149, 0, 0.4); color: #ffb347; }
        .btn-cydia { border-color: rgba(255, 59, 48, 0.4); color: #ff6b6b; }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="CydiaIcon.png" alt="Ra1nbow Icon" class="repo-icon">
        <h1>RA1NBOW REPO</h1>
        <p>[ Private iOS Tweaks & Utilities ]</p>
    </div>

    <div class="devs-section">
        <div class="section-title">> Team Developers</div>
        <div class="dev-cards">
            <div class="dev-card">
                <img src="CydiaIcon.png" alt="ra1n_developer" class="dev-avatar-img">
                <div class="dev-name">@ra1n_developer</div>
            </div>
            <div class="dev-card">
                <img src="CydiaIcon_2.png" alt="Unnamed_200" class="dev-avatar-img cyan">
                <div class="dev-name">@Unnamed_200</div>
            </div>
        </div>
    </div>

    <div class="tg-section">
        <div class="section-title">> Official Community</div>
        <a href="https://t.me/iPhone_jailbreak_official" target="_blank" class="btn-tg">
            ✈ TELEGRAM CHANNEL
        </a>
    </div>

    <div class="managers-section">
        <div class="section-title">> Add Repository</div>
        <div class="pm-grid">
            <a href="sileo://source/https://ra1nbowdashmlp.github.io/" class="btn-pm btn-sileo">
                + Sileo
            </a>
            <a href="zbra://sources/add/https://ra1nbowdashmlp.github.io/" class="btn-pm btn-zebra">
                + Zebra
            </a>
            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://ra1nbowdashmlp.github.io/" class="btn-pm btn-cydia">
                + Cydia
            </a>
            <a href="installer://add/https://ra1nbowdashmlp.github.io/" class="btn-pm">
                + Installer
            </a>
        </div>
    </div>

    <div class="footer">
        STATUS: ONLINE | AUTO-REDIRECT SUPPORTED
    </div>
</div>

</body>
</html>
