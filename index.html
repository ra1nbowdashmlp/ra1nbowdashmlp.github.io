<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ra1nbow Repo</title>
    <style>
        :root {
            --bg-color: #05080a;
            --card-bg: #11161d;
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-dim: #7d8590;
            --border-color: rgba(0, 255, 102, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.15);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .repo-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .repo-icon:hover {
            transform: scale(1.05);
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.82rem;
        }

        .devs-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }

        .dev-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 420px) {
            .dev-cards {
                grid-template-columns: 1fr;
            }
        }

        .dev-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .dev-card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
            background: rgba(0, 255, 102, 0.05);
        }

        .dev-avatar-img {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
            object-fit: cover;
        }

        .dev-avatar-img.cyan {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }

        .dev-name {
            font-weight: bold;
            font-size: 0.82rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tg-section {
            margin-bottom: 20px;
        }

        /* Базовый неоновый стиль кнопок в стиле BookRa1n */
        .btn-style {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-style:hover {
            transform: translateY(-2px);
            filter: brightness(1.25);
        }

        .btn-style:active {
            transform: translateY(1px) scale(0.99);
        }

        /* Яркий Неон: Telegram */
        .btn-tg {
            border: 1px solid #00bfff;
            color: #00e5ff;
            background: linear-gradient(180deg, rgba(0, 191, 255, 0.25) 0%, rgba(0, 191, 255, 0.05) 100%);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }
        .btn-tg:hover {
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.6);
        }

        .managers-section {
            margin-bottom: 15px;
        }

        .pm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Яркий Неон: Sileo */
        .btn-sileo {
            border: 1px solid #007aff;
            color: #3399ff;
            background: linear-gradient(180deg, rgba(0, 122, 255, 0.25) 0%, rgba(0, 122, 255, 0.05) 100%);
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3);
            text-shadow: 0 0 8px rgba(51, 153, 255, 0.6);
        }
        .btn-sileo:hover {
            box-shadow: 0 0 25px rgba(0, 122, 255, 0.6);
        }

        /* Яркий Неон: Zebra */
        .btn-zebra {
            border: 1px solid #ff9500;
            color: #ffaa00;
            background: linear-gradient(180deg, rgba(255, 149, 0, 0.25) 0%, rgba(255, 149, 0, 0.05) 100%);
            box-shadow: 0 0 15px rgba(255, 149, 0, 0.3);
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
        }
        .btn-zebra:hover {
            box-shadow: 0 0 25px rgba(255, 149, 0, 0.6);
        }

        /* Яркий Неон: Cydia */
        .btn-cydia {
            border: 1px solid #ff2d55;
            color: #ff4d6d;
            background: linear-gradient(180deg, rgba(255, 45, 85, 0.25) 0%, rgba(255, 45, 85, 0.05) 100%);
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.3);
            text-shadow: 0 0 8px rgba(255, 77, 109, 0.6);
        }
        .btn-cydia:hover {
            box-shadow: 0 0 25px rgba(255, 45, 85, 0.6);
        }

        /* Яркий Неон: Installer */
        .btn-installer {
            border: 1px solid #00ff66;
            color: #55ff99;
            background: linear-gradient(180deg, rgba(0, 255, 102, 0.2) 0%, rgba(0, 255, 102, 0.04) 100%);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }
        .btn-installer:hover {
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="container">
    <div class="header">
        <img src="CydiaIcon.png" alt="Ra1nbow Icon" class="repo-icon">
        <h1>RA1NBOW REPO</h1>
        <p>[ Private iOS Tweaks & Utilities ]</p>
    </div>

    <div class="devs-section">
        <div class="section-title">> Team Developers</div>
        <div class="dev-cards">
            <div class="dev-card">
                <img src="CydiaIcon.png" alt="ra1n_developer" class="dev-avatar-img">
                <div class="dev-name">@ra1n_developer</div>
            </div>
            <div class="dev-card">
                <img src="avatarinfo.jpg" alt="Unnamed_200" class="dev-avatar-img cyan">
                <div class="dev-name">@Unnamed_200</div>
            </div>
        </div>
    </div>

    <div class="tg-section">
        <div class="section-title">> Official Community</div>
        <a href="https://t.me/iPhone_jailbreak_official" target="_blank" class="btn-style btn-tg">
            ✈ TELEGRAM CHANNEL
        </a>
    </div>

    <div class="managers-section">
        <div class="section-title">> Add Repository</div>
        <div class="pm-grid">
            <a href="sileo://source/https://ra1nbowdashmlp.github.io/" class="btn-style btn-sileo">
                + Sileo
            </a>
            <a href="zbra://sources/add/https://ra1nbowdashmlp.github.io/" class="btn-style btn-zebra">
                + Zebra
            </a>
            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://ra1nbowdashmlp.github.io/" class="btn-style btn-cydia">
                + Cydia
            </a>
            <a href="installer://add/https://ra1nbowdashmlp.github.io/" class="btn-style btn-installer">
                + Installer
            </a>
        </div>
    </div>

    <div class="footer">
        STATUS: ONLINE | AUTO-REDIRECT SUPPORTED
    </div>
</div>

<script>
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 65 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.7 + 0.3,
        wind: Math.random() * 0.4 - 0.2,
        opacity: Math.random() * 0.5 + 0.2
    }));

    const stars = [];

    document.addEventListener('mousemove', (e) => {
        for (let i = 0; i < 2; i++) {
            stars.push({
                x: e.clientX + (Math.random() - 0.5) * 10,
                y: e.clientY + (Math.random() - 0.5) * 10,
                size: Math.random() * 3 + 1,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5 - 0.5,
                alpha: 1,
                color: Math.random() > 0.5 ? '#00ff66' : '#00e5ff'
            });
        }
    });

    function render() {
        ctx.clearRect(0, 0, width, height);

        flakes.forEach(flake => {
            ctx.beginPath();
            ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
            ctx.fill();

            flake.y += flake.speed;
            flake.x += flake.wind;

            if (flake.y > height) {
                flake.y = -5;
                flake.x = Math.random() * width;
            }
        });

        for (let i = stars.length - 1; i >= 0; i--) {
            const s = stars[i];
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.alpha;
            ctx.fill();
            ctx.globalAlpha = 1;

            s.x += s.vx;
            s.y += s.vy;
            s.alpha -= 0.025;

            if (s.alpha <= 0) {
                stars.splice(i, 1);
            }
        }

        requestAnimationFrame(render);
    }

    render();
</script>

</body>
</html>
