<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ra1nbow Repo</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.75);
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --border-color: rgba(0, 255, 102, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.1) 0%, transparent 70%),
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.08);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .devs-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 12px;
        }

        .dev-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .dev-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .dev-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }

        .dev-avatar {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .dev-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .btn-add {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .btn-add:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            transform: scale(1.02);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RA1NBOW REPO</h1>
        <p>[ Private iOS Tweaks & Utilities ]</p>
    </div>

    <div class="devs-section">
        <div class="section-title">> Developers</div>
        <div class="dev-cards">
            <div class="dev-card">
                <div class="dev-avatar"></div>
                <div class="dev-name">@ra1n_developer</div>
            </div>
            <div class="dev-card">
                <div class="dev-avatar" style="background-color: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan);"></div>
                <div class="dev-name">@Unnamed_200</div>
            </div>
        </div>
    </div>

    <a href="sileo://source/https://ra1nbowdashmlp.github.io/" class="btn-add">
        + ADD TO SILEO
    </a>

    <div class="footer">
        STATUS: ONLINE | Cydia / Zebra / Sileo Compatible
    </div>
</div>

</body>
</html>
