<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ra1nbow Repo</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --accent-purple: #af52de;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --border-color: rgba(0, 255, 102, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 75%),
                linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85));
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2.2rem;
            color: var(--accent-green);
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .devs-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 12px;
        }

        .dev-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .dev-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .dev-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }

        .dev-avatar {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Менеджеры пакетов */
        .managers-section {
            margin-bottom: 20px;
        }

        .pm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-pm {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-pm:hover {
            transform: translateY(-2px);
            background: rgba(0, 255, 102, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .btn-sileo:hover {
            border-color: #007aff;
            color: #007aff;
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3);
            background: rgba(0, 122, 255, 0.1);
        }

        .btn-zebra:hover {
            border-color: #ff9500;
            color: #ff9500;
            box-shadow: 0 0 15px rgba(255, 149, 0, 0.3);
            background: rgba(255, 149, 0, 0.1);
        }

        .btn-cydia:hover {
            border-color: #ff3b30;
            color: #ff3b30;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.3);
            background: rgba(255, 59, 48, 0.1);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RA1NBOW REPO</h1>
        <p>[ Private iOS Tweaks & Utilities ]</p>
    </div>

    <div class="devs-section">
        <div class="section-title">> Team Developers</div>
        <div class="dev-cards">
            <div class="dev-card">
                <div class="dev-avatar"></div>
                <div class="dev-name">@ra1n_developer</div>
            </div>
            <div class="dev-card">
                <div class="dev-avatar" style="background-color: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan);"></div>
                <div class="dev-name">@Unnamed_200</div>
            </div>
        </div>
    </div>

    <div class="managers-section">
        <div class="section-title">> Add Repository</div>
        <div class="pm-grid">
            <a href="sileo://source/https://ra1nbowdashmlp.github.io/" class="btn-pm btn-sileo">
                + Sileo
            </a>
            <a href="zbra://sources/add/https://ra1nbowdashmlp.github.io/" class="btn-pm btn-zebra">
                + Zebra
            </a>
            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://ra1nbowdashmlp.github.io/" class="btn-pm btn-cydia">
                + Cydia
            </a>
            <a href="installer://add/https://ra1nbowdashmlp.github.io/" class="btn-pm">
                + Installer
            </a>
        </div>
    </div>

    <div class="footer">
        STATUS: ONLINE | AUTO-REDIRECT SUPPORTED
    </div>
</div>

</body>
</html>
